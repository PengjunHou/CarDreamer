env:
  eval: False

  world:
    carla_port: 2000
    client_timeout_s: 20.0
    town: "Town04" # which town map to use
    actor_active_distance: 100
    fixed_delta_seconds: 0.1
    auto_lane_change: True
    traffic:
      tm_seed: 2024

  observation: &observation
    camera:
      handler: camera
      blueprint: sensor.camera.rgb
      key: camera
      shape: [640, 640, 3]
      transform:
        x: 1.5
        z: 2.0
      attributes:
        image_size_x: 640
        image_size_y: 640
        fov: 120.0
        sensor_tick: 0.1

    # LiDAR sensor
    lidar:
      handler: lidar
      blueprint: sensor.lidar.ray_cast
      key: lidar
      shape: [128, 128, 3]
      lidar_bin: 0.25
      ego_offset: 12
      transform:
        z: 2.1
      attributes:
        range: 32
        channels: 32
        sensor_tick: 0.1

    # collision sensor
    collision:
      handler: collision
      blueprint: sensor.other.collision
      key: collision
      shape: [1]

    spectator:
      handler: spectator
      key: spectator
      shape: [512, 512, 3]
      height: 40
      fov: 90
      sensor_tick: 0.1
      pitch: -90

    # BEV with only roadmap, vehicles, and waypoints
    birdeye_raw:
      handler: birdeye
      key: birdeye_raw
      shape: [128, 128, 3]
      obs_range: 32
      ego_offset: 12
      sight_fov: 150
      sight_range: 32
      observability: full # [full, recursive_fov, fov]
      color_by_obs: False
      waypoint_obs: visible # [neighbor, visible, all]
      extend_wpt: False
      entities: [roadmap, waypoints, ego_vehicle, background_vehicles]

    # Render waypoints on BEV
    birdeye_wpt:
      handler: birdeye
      key: birdeye_wpt
      shape: [128, 128, 3]
      obs_range: 64
      ego_offset: 12
      # sight_fov = 150 equivalent to [150, 150] for [front, rear] FOV
      # Use [150, 90] to mimic human driver views
      sight_fov: 64
      sight_range: 128
      observability: full
      color_by_obs: False
      waypoint_obs: visible
      extend_wpt: False
      entities:
        [
          roadmap,
          ego_vehicle,
          background_vehicles,
        ]

    # Wide ego-centered BEV for the WAM graph-timeline visualization (NOT a model input).
    # obs_range=100 + ego_offset=50 => ego at the center, ~50 m in every direction, so all
    # nearby objects fit. Enable it only during recording (scripts' --wide-bev), then render with
    # `visualize_wam_graph_timeline.py --bev-obs-range 100 --bev-ego-offset 50`.
    birdeye_wam100:
      handler: birdeye
      key: birdeye_wam100
      shape: [256, 256, 3]
      obs_range: 100
      ego_offset: 50          # = obs_range/2 => ego centered (not bottom-anchored)
      sight_fov: 64
      sight_range: 128
      observability: full
      color_by_obs: False
      waypoint_obs: visible
      extend_wpt: False
      entities:
        [
          roadmap,
          ego_vehicle,
          background_vehicles,
        ]

    # Render all information on BEV
    birdeye_gt:
      handler: birdeye
      key: birdeye_gt
      shape: [128, 128, 3]
      obs_range: 32
      ego_offset: 12
      sight_fov: 150
      sight_range: 32
      observability: full
      color_by_obs: True
      waypoint_obs: visible
      extend_wpt: False
      entities:
        [
          roadmap,
          waypoints,
          background_waypoints,
          fov_lines,
          ego_vehicle,
          background_vehicles,
        ]

    # Render traffic sign on BEV
    birdeye_with_traffic_lights:
      handler: birdeye
      key: birdeye_with_traffic_lights
      shape: [128, 128, 3]
      obs_range: 32
      ego_offset: 12
      sight_fov: 150
      sight_range: 32
      observability: full
      color_by_obs: False
      waypoint_obs: visible
      extend_wpt: False
      entities:
        [
          roadmap,
          waypoints,
          background_waypoints,
          ego_vehicle,
          background_vehicles,
          traffic_lights,
          stop_signs,
        ]

    birdeye_wpt_with_errors:
      handler: birdeye
      key: birdeye_wpt_with_errors
      shape: [128, 128, 3]
      obs_range: 32
      ego_offset: 12
      sight_fov: 150
      sight_range: 32
      observability: full
      color_by_obs: False
      waypoint_obs: visible
      extend_wpt: False
      error_rate: 0.2
      entities: [roadmap, waypoints, error_background_waypoints, ego_vehicle, background_vehicles]
  
  group_observation:
    <<: *observation

  display:
    enable: True
    render_keys: [camera, birdeye_wpt]
    image_size: 512

  action:
    discrete: True
    # Discrete control space. Use continuos_acc and continuous_steer if discrete is False
    discrete_acc: [-2.0, 0.0, 2.0] # discrete value of accelerations
    discrete_steer: [-0.6, -0.2, 0.0, 0.2, 0.6] # discrete value of steering angles
    continuous_acc: [-3.0, 3.0] # continuous value of accelerations
    continuous_steer: [-1.0, 1.0] # continuous value of steering angles
    n_commands: 3 # number of text commands for message handler

  communication: # V2V streaming communication model (Communication Model Specification)
    # --- timing parameters (seconds; converted to steps via world.fixed_delta_seconds) ---
    policy_duration_s: 2.0          # Td  -- cooperative policy lifetime (§2.1)
    sensor_period_s: 0.2            # Ts  -- collaborator sensor sampling / streaming period (§2.2) # TODO：这里需要是fixed_delta_seconds的倍数
    prediction_window_s: 2.0        # Tw  -- receive-queue window on sensor time (§2.3)
    action_period_s: 1.0            # Ta  -- notable-motion prediction cadence (§2.4)
    proc_delay_s: 0.05              # T_proc -- per-message processing delay (§2.2; summed then rounded)
    flush_old_policy_queue: False   # §9  -- keep (True) vs drop (False) old-policy queued messages
    allow_cross_policy_messages: False  # §11 -- use only the active policy's messages
    collaborator_modalities: [objlist, bev]  # bundled modalities each collaborator streams per message
    # --- transmission rate model (policy-allocated bandwidth + FSPL/SNR, §8) ---
    policy_bandwidth_hz: 6000000.0  # base bandwidth (Hz); actual B = policy_bandwidth_hz * ratio
    bandwidth_ratio: 1.0       # per-collaborator bandwidth ratio in [0, 1]; ratios need not sum to 1
    tx_power_dbm: 20.0        # transmit power (dBm)
    noise_figure_db: 9.0      # receiver noise figure (dB)
    carrier_freq_hz: 5900000000.0  # carrier frequency (Hz)
    distance_decay_m: 60.0    # distance decay constant for the rate model (meters)
    min_rate_factor: 0.2      # minimum rate factor (prevents rate from dropping to zero)
    overhead_bytes: 64        # fixed protocol overhead per message (bytes)
    group_update_period: 20   # how often to recompute groups (steps)

  wam:
    enabled: True
    notable_distance_m: 10.0
    max_notable_objects: 3
    reference_waypoint_count: 6
    prediction_horizon_steps: 6
    uncertainty_threshold: 1.0
    visible_uncertainty: 0.2
    invisible_uncertainty: 2.0
    default_modality: bev
    # Transport approximation for BEV messages:
    #   raster  -> charge raw semantic raster bytes (C*H*W)
    #   feature -> still carry BEV raster in the graph, but charge a compressed/encoded feature vector.
    bev_payload_mode: feature
    bev_feature_dim: 256
    bev_feature_dtype_bytes: 4
    base_station_policy: placeholder_all
    predictor_mode: rule       # rule | checkpoint
    predictor_checkpoint: null # Stage-1 checkpoint path when predictor_mode=checkpoint
    predictor_device: auto     # auto | cpu | cuda
    predictor_uncertainty_source: notable_weighted_trace
    predictor_history_window: 10
    policy_sampler_mode: request_all  # request_all | random_duration | stage2 | lyapunov
    uwm_checkpoint: null       # Stage-2 UWM checkpoint when policy_sampler_mode=stage2
    uwm_candidates: 4          # propose_policies n_candidates for the stage2 sampler
    # Lyapunov-guided world-action policy search (policy_sampler_mode="lyapunov", V2X paper Sec IV).
    # The BS solves the per-frame program (P2) over heuristic action chunks a=(S,B,D,n), scoring each by a
    # Stage-1 U_phi rollout (predictor_checkpoint below; rule fallback if null). Online wiring is written but
    # NOT live-verified (CARLA); the offline pipeline (scripts/run_wam_lyapunov_offline.py) is the validation.
    lyapunov:
      lam: 1.0                 # Λ  (utility/backlog knob; Prop 1)
      c0: 0.5                  # amortized re-planning penalty (uncertainty units)
      budget_bandwidth_ratio: 0.4   # B̄_bgt  (per-slot allocated-bandwidth budget)
      F_max_slots: 20          # F_max (eq 7)
      n_min_slots: 5           # n_min (eq 2)
      B_max_ratio: 1.0         # Σ B ≤ B_max (per sub-action)
      bandwidth_grid: [0.2, 0.5, 0.8, 1.0]   # heuristic candidate bandwidth ratios
      duration_grid: [5, 10, 20]             # heuristic candidate sub-action durations
      j_max: 2                 # chunk length cap (J≥1)
      eps_gap: 0.15            # ε_gap (eq 8 mismatch tolerance)
      t_min_slots: 3           # T_min (eq 8)
      T_a_slots: 5             # Ta (eq 8 monitoring cadence)
      alpha: 0.5               # α in U = αU^mot + (1−α)U^cov
      predictor_checkpoint: null  # Stage-1 U_phi; null -> rule fallback (NO Stage-2 UWM)
    random_policy:
      local_prob: 0.2
      collaborator_counts: ["1", "2", all]
      modalities:
        - [objlist]
        - [bev]
        - [objlist, bev]
      bandwidth_ratios: [0.2,0.5, 0.8, 1.0]
      respect_request: False
    coverage:
      enabled: True
      past_route_distance_m: 8.0
      future_route_distance_m: 20.0
      corridor_width_m: 8.0
      coverage_distance_scale_m: 20.0
      route_risk_distance_scale_m: 20.0
      u_prior: 1.0
      alpha_motion: 1.0
      beta_coverage: 1.0

runtime_logging:
  enabled: True
  level: DEBUG
  console_level: INFO
  file_level: DEBUG
  console: True
  file: True
  console_key_only: True
  step_debug_interval: 1
  driver_debug_shapes: False
