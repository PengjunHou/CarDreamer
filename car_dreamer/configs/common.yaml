env:
  eval: False

  world:
    carla_port: 2000
    town: "Town04" # which town map to use
    actor_active_distance: 100
    fixed_delta_seconds: 0.1
    auto_lane_change: True
    traffic:
      tm_seed: 2024

  observation: &observation
    camera:
      handler: camera
      blueprint: sensor.camera.rgb
      key: camera
      shape: [640, 640, 3]
      transform:
        x: 1.5
        z: 2.0
      attributes:
        image_size_x: 640
        image_size_y: 640
        fov: 120.0
        sensor_tick: 0.1

    # LiDAR sensor
    lidar:
      handler: lidar
      blueprint: sensor.lidar.ray_cast
      key: lidar
      shape: [128, 128, 3]
      lidar_bin: 0.25
      ego_offset: 12
      transform:
        z: 2.1
      attributes:
        range: 32
        channels: 32
        sensor_tick: 0.1

    # collision sensor
    collision:
      handler: collision
      blueprint: sensor.other.collision
      key: collision
      shape: [1]

    spectator:
      handler: spectator
      key: spectator
      shape: [512, 512, 3]
      height: 40
      fov: 90
      sensor_tick: 0.1
      pitch: -90

    # BEV with only roadmap, vehicles, and waypoints
    birdeye_raw:
      handler: birdeye
      key: birdeye_raw
      shape: [128, 128, 3]
      obs_range: 32
      ego_offset: 12
      sight_fov: 150
      sight_range: 32
      observability: full # [full, recursive_fov, fov]
      color_by_obs: False
      waypoint_obs: visible # [neighbor, visible, all]
      extend_wpt: False
      entities: [roadmap, waypoints, ego_vehicle, background_vehicles]

    # Render waypoints on BEV
    birdeye_wpt:
      handler: birdeye
      key: birdeye_wpt
      shape: [128, 128, 3]
      obs_range: 64
      ego_offset: 12
      # sight_fov = 150 equivalent to [150, 150] for [front, rear] FOV
      # Use [150, 90] to mimic human driver views
      sight_fov: 64
      sight_range: 128
      observability: full
      color_by_obs: False
      waypoint_obs: visible
      extend_wpt: False
      entities:
        [
          roadmap,
          ego_vehicle,
          background_vehicles,
        ]

    # Render all information on BEV
    birdeye_gt:
      handler: birdeye
      key: birdeye_gt
      shape: [128, 128, 3]
      obs_range: 32
      ego_offset: 12
      sight_fov: 150
      sight_range: 32
      observability: full
      color_by_obs: True
      waypoint_obs: visible
      extend_wpt: False
      entities:
        [
          roadmap,
          waypoints,
          background_waypoints,
          fov_lines,
          ego_vehicle,
          background_vehicles,
        ]

    # Render traffic sign on BEV
    birdeye_with_traffic_lights:
      handler: birdeye
      key: birdeye_with_traffic_lights
      shape: [128, 128, 3]
      obs_range: 32
      ego_offset: 12
      sight_fov: 150
      sight_range: 32
      observability: full
      color_by_obs: False
      waypoint_obs: visible
      extend_wpt: False
      entities:
        [
          roadmap,
          waypoints,
          background_waypoints,
          ego_vehicle,
          background_vehicles,
          traffic_lights,
          stop_signs,
        ]

    birdeye_wpt_with_errors:
      handler: birdeye
      key: birdeye_wpt_with_errors
      shape: [128, 128, 3]
      obs_range: 32
      ego_offset: 12
      sight_fov: 150
      sight_range: 32
      observability: full
      color_by_obs: False
      waypoint_obs: visible
      extend_wpt: False
      error_rate: 0.2
      entities: [roadmap, waypoints, error_background_waypoints, ego_vehicle, background_vehicles]
  
  group_observation:
    <<: *observation

  display:
    enable: True
    render_keys: [camera, birdeye_wpt]
    image_size: 512

  action:
    discrete: True
    # Discrete control space. Use continuos_acc and continuous_steer if discrete is False
    discrete_acc: [-2.0, 0.0, 2.0] # discrete value of accelerations
    discrete_steer: [-0.6, -0.2, 0.0, 0.2, 0.6] # discrete value of steering angles
    continuous_acc: [-3.0, 3.0] # continuous value of accelerations
    continuous_steer: [-1.0, 1.0] # continuous value of steering angles
    n_commands: 3 # number of text commands for message handler

  speed_preset: ""

  dump_vlm_records_each_step: True
  vlm_dump_dir: "data"
  policy_id: "P3"
  policy_seed: 0
  policy_bandwidth_floor: 0.1

  vlm:
    scene_description_max_new_tokens: 96
    score_max_new_tokens: 512
    enable_step_cache: True
    enable_multi_query_scoring: True

  communication: # V2V communication global default settings
    group_update_period: 20   # how often to recompute groups (steps)
    comm_period: 1            # how often to trigger intra-group communication (steps)
    uplink_bps: 6000000.0     # per-vehicle uplink bandwidth (bps)
    downlink_bps: 12000000.0  # per-vehicle downlink bandwidth (bps)
    base_rtt_s: 0.02          # base round-trip time (seconds)
    proc_delay_s: 0.005       # processing delay (seconds)
    distance_decay_m: 60.0    # distance decay constant for latency model (meters)
    min_rate_factor: 0.2      # minimum rate factor (prevents rate from dropping to zero)
    jitter_s: 0.0             # random jitter added to latency (seconds, 0 = disabled)
    overhead_bytes: 64        # fixed protocol overhead per message (bytes)
    drop_on_capacity_exceeded: false
    log_dropped_messages: true

runtime_logging:
  enabled: True
  level: DEBUG
  console_level: INFO
  file_level: DEBUG
  console: True
  file: True
  console_key_only: True
  step_debug_interval: 1
  driver_debug_shapes: False
