# Per-task config for `carla_group_right_turn_auto` (merged into env.* by load_task_configs).
# Owns this task's non-ego traffic (car flow + cooperative/background actors); ego stays in tasks.yaml.
#
# scenario_actors schema (see car_dreamer/toolkit/scenario_actors.py):
#   vehicles:
#     - count: N                    # N random background cars (TM roam); no camera, NOT a candidate
#     - start: [x, y, z(, yaw)]     # one V2V cooperative CANDIDATE (camera-equipped, policy-selectable)
#                                    #   no `destination`  -> stays stationary (parked observer)
#       destination: [x, y, z]      #   with `destination` -> drives there (TM); target_speed default 25
#       autopilot_roam: true        #   no `destination` -> TM autopilot follows the road instead of parking
#       target_speed: 25            # optional (km/h)
#   pedestrians:
#     - count: N                    # random nav-mesh walkers
#     - start: [x, y, z]
#       destination: [x, y, z]      # go_to_location; on_arrival: keep (default) | stop | loop
#   cross_factor: 0.1               # optional global jaywalk probability
#
# Shared cooperative config lives at env top level (declared once, not per vehicle):
#   group_observation (candidate sensors) + coop_participation_prob (per-episode pool participation).
env:
  # --- car flow (background traffic stream); overrides the carla_right_turn_simple anchor default ---
  flow_spawn_point: [-3.4, -151.2, 0.1, 90.0]
  min_flow_dist: 12
  max_flow_dist: 18
  reset_warmup_ticks: 20

  # --- shared V2V cooperative settings (apply to every scenario vehicle that has a `start`) ---
  coop_participation_prob: 1
  group_observation:
    # birdeye_wpt: each collaborator renders its own vehicle-centric BEV (itself drawn as ego);
    # dumps to data/birdeye_frames/vehicle_<id>/ when group_observation.dump_frames is on.
    enabled: [camera, collision, birdeye_wpt]
    camera:
      fov: 180

  pedestrian_safety:
    enabled: true
    max_distance_m: 12.0
    front_angle_deg: 50.0
    ttc_threshold_s: 2.0
    brake_distance_m: 5.0
    restore_autopilot: true

  scenario_actors:
    cross_factor: 0.1
    # Explicit vehicle start/destination coordinates are design points, not necessarily exact CARLA
    # map spawn points. Project them to the nearest drivable lane waypoint before spawning/routing so
    # CARLA/TM uses a predictable legal location. Use `spawn_point` instead to snap to the nearest
    # CARLA map spawn point, or `exact` to keep raw coordinates.
    vehicle_start_mode: road   # exact | road | spawn_point
    vehicle_destination_mode: road    # exact | road | spawn_point
    preserve_vehicle_start_yaw: false
    vehicle_spawn_z_offset: 0.1
    pedestrian_start_mode: exact
    pedestrian_destination_mode: exact
    pedestrian_navmesh_samples: 200
    snap_warn_distance_m: 0.5
    vehicles:
      - count: 8                            # background traffic (no camera, not a candidate)
      # --- cooperative candidates (start point => camera-equipped, selectable by the policy) ---
      # Parked observer on the junction's EAST approach (road 18), watching the ego's right turn.
      # Must stay OUTSIDE junction 1221 (bbox x in [-13.6, 19.4], y in [-149.4, -123.6]): the old
      # point [14.88, -139.41] sat inside it, 1.07m off lane center and 23deg askew. `road` mode
      # snaps to the lane center and takes the lane heading (~-178.8 = facing the junction), so no
      # explicit yaw / `exact` override is needed. Verify with scripts/check_scenario_spawns.py.
      - start: [22.8, -137.8, 0.1]
        autopilot_roam: false
      - start: [4.10, -56.12, 0.28]
        autopilot_roam: true
      - start: [5.78, -113.23, 0.1]
        autopilot_roam: true
      # # candidates that also drive via Traffic Manager autopilot (target_speed omitted -> 25):
      # - start: [9.0, -124.2, 0.1, 270]
      #   # destination: [9.0, -164.2, 0.1]
      #   autopilot_roam: true
      # - start: [14.4, -139.2, 0.1, 180.0]
      #   destination: [-35.0, -139.2, 0.1]
      # - start: [-39.8, -135.1, 0.1]
      #   autopilot_roam: true
      # ego [-33.8, -135.1, 0.1, 0.0]
      # Roaming collaborator approaching from the south on road 29. Kept NORTH of junction 655
      # (bbox y in [-214.2, -184.0]): the old point [0.70, -189.73] spawned inside it, where TM
      # behaves erratically.
      - start: [0.5, -180.0, 0.1]
        # destination: [0.5, -112.0, 0.1]
        autopilot_roam: true
        target_speed: 25
    # --- two-wheeler traffic (bicycles + motorcycles) ---
    # `cooperative: false` on the placed ones: a `start` would otherwise make them camera-equipped
    # V2V candidates and (with coop_participation_prob: 1) pull them into the cooperative pool.
    # They are vehicle.* actors, so they appear in data/birdeye_frames like any other vehicle --
    # drawn from their bounding box, i.e. small rectangles, not visually distinct from cars.
    # Filtered by CARLA's `base_type` tag rather than model ids, so a CARLA version that adds or
    # renames a model is picked up automatically (0.9.16 ships 3 bicycles + 4 motorcycles).
      - count: 3                            # random bicycles
        blueprint: vehicle.*
        blueprint_attributes: {base_type: bicycle}
      - count: 2                            # random motorcycles
        blueprint: vehicle.*
        blueprint_attributes: {base_type: motorcycle}
      # Bicycle in the ego's post-turn lane (road 28 lane 3, southbound) -- the ego meets it right
      # after the right turn and has to deal with a slow vulnerable road user.
      - start: [-5.01, -100.0, 0.1]
        blueprint: vehicle.gazelle.omafiets
        cooperative: false
        autopilot_roam: true
        target_speed: 12
      # Motorcycle upstream of the car flow on road 29 (lane 3, southbound toward the junction).
      - start: [-3.41, -165.0, 0.1]
        blueprint: vehicle.yamaha.yzf
        cooperative: false
        autopilot_roam: true
        target_speed: 30
