carla_group_right_turn_auto:
  <<: *carla_right_turn_simple
  env.name: CarlaGroupRightTurnAutoEnv-v0
  env.lane_end_point: [-5.0, -110.3, 0.1, 90.0]
  # Non-ego vehicle settings (car flow + V2V/cooperative vehicles) are configured in
  # configs/tasks/carla_group_right_turn_auto.yaml, alongside the scenario_actors block.
  # Feature & graph construction (task-specific)
  env.feature_size: 3072
  env.graph.window_s: 2.0
  env.graph.tmax: 20
  env.graph.max_nodes: 3
  env.graph.feat_dim_max: 3072
  env.graph.star_graph: true
  # WAM policy-conditioned hetero graph (Design §4-§7, §9). The env builds the graph each
  # step; the §5 embedding + §9 HGT encoder (graph.embed) is for the world-model side.
  env.wam.build_graph: true
  env.wam.graph.embed: false
  env.wam.graph.hidden_dim: 256
  env.wam.graph.num_layers: 3
  env.wam.graph.num_heads: 8
  env.wam.graph.route_waypoints: 6
  env.wam.graph.max_object_nodes: 32
  env.wam.graph.gamma_freshness: 5.0
  # per-vehicle visibility-aware BEV semantic raster B^sem (§5.3): channels = object classes (4) + ego +
  # route + drivable = 7; bev_size is the raster H/W; bev_range_m is the half-extent (meters to each edge).
  env.wam.graph.bev_channels: 7
  env.wam.graph.bev_size: 64
  env.wam.graph.bev_range_m: 50.0
  # WAM BS-centric Diffusion UWM (Design Update §7-§8, §13). hidden_dim/route_waypoints are shared with
  # wam.graph above; bev_latent_dim defaults to hidden_dim. Generated variables = future policy chunk
  # (H,M,P) + future request BEV latent (H,Dz); object-state X is a condition token, not generated.
  env.wam.flow.num_layers: 4
  env.wam.flow.num_heads: 8
  env.wam.flow.time_embed_dim: 128
  env.wam.flow.max_members: 8
  env.wam.flow.num_formats: 2
  env.wam.flow.horizon: 6
  env.wam.flow.history_window: 0
  env.wam.flow.num_register_tokens: 4
  env.wam.flow.enable_bev: true
  env.wam.flow.n_inference_steps: 10
  # WAM Stage-1 training (Design §16.1): pretrain graph encoder + deterministic heads (notable +
  # Gaussian trajectory) on GT labels; produces U^π and an encoder checkpoint for Stage-2 warm-start.
  env.wam.stage1.lr: 0.0003
  env.wam.stage1.batch_size: 8
  env.wam.stage1.steps: 2000
  env.wam.stage1.lambda_perc: 1.0
  env.wam.stage1.lambda_traj: 1.0
  # Per-object weight in the trajectory NLL: notable objects vs the rest. Default (1.0, 0.0) supervises
  # only notable objects (original behavior). Set traj_weight_nonnotable>0 (e.g. 0.1, or 1.0 for equal
  # weight) to also calibrate the variance head on non-notable objects -- so the live notable_prob-
  # weighted U^pi does not weight an untrained (OOD) variance for them.
  env.wam.stage1.traj_weight_notable: 1.0
  env.wam.stage1.traj_weight_nonnotable: 0.0
  env.wam.stage1.lambda_vis: 1.0
  env.wam.stage1.lambda_inv: 1.0
  env.wam.stage1.grad_clip: 1.0
  env.wam.stage1.log_interval: 50
  env.wam.stage1.ckpt_interval: 500
  env.wam.stage1.history_window: 10
  env.wam.stage1.sample_period_s: 0.2
  env.wam.stage1.temporal_hidden_dim: 256
  env.wam.stage1.head_hidden_dim: 256
  env.wam.stage1.traj_horizon_s: 1.0
  env.wam.stage1.traj_samples: 5
  env.wam.stage1.fixed_dt: 0.1
  # WAM Stage-2 training (Design §16.2): offline diffusion-UWM trainer hyper-parameters.
  env.wam.stage2.lr: 0.0003
  env.wam.stage2.batch_size: 16
  env.wam.stage2.steps: 2000
  env.wam.stage2.w_policy: 1.0
  env.wam.stage2.w_bev: 1.0
  env.wam.stage2.w_bev_recon: 1.0
  env.wam.stage2.grad_clip: 1.0
  env.wam.stage2.log_interval: 50
  env.wam.stage2.ckpt_interval: 500

